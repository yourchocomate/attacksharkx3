name: Release

# Tag a version to publish:  git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to check the build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Share this group with CI so a commit is not built twice.
#
# Pushing a commit starts CI, and pushing the tag that points at it starts this
# workflow — two runs doing nearly identical work on identical source. Keying
# the group on the commit means the tag push cancels the CI run still in flight.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release:
    # One arm64 runner builds both slices.
    #
    # This used to be a two-runner matrix, arm64 on macos-14 and x86_64 natively
    # on macos-13. GitHub has retired the Intel runners, so the x86_64 job never
    # got a machine — it sat queued for eighteen hours while arm64 finished in
    # three minutes, and because `release` needed both, no release was ever
    # produced. That is why tags only ever showed GitHub's own source archives.
    #
    # `swift build --arch arm64 --arch x86_64` would build a universal binary in
    # one pass but drives xcbuild, so it needs a full Xcode. `--triple` does not:
    # it cross-compiles with the command line tools alone, which means this is
    # reproducible on any Mac and was verified locally before being committed.
    #
    # macos-15 rather than macos-14, which ships Swift 5.10 — a type checker
    # that gives up on SwiftUI expressions a current compiler handles without
    # comment. That cost two failed builds on code typing locally in under a
    # tenth of the warning threshold.
    runs-on: macos-15
    # A job that never starts is worse than one that fails: the retired Intel
    # runner sat queued for eighteen hours and the release simply never
    # appeared. This bounds the damage of a bad label or a wedged step.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Take the version from the tag, so one thing decides it.
      #
      # The disk image is named from CFBundleShortVersionString, which is edited
      # by hand and drifts: v0.2.0 shipped asctl-0.1.0.dmg because the plist had
      # never been bumped. Patching before the build matters — the plist is
      # linked into the binary with -sectcreate, so a later edit would fix the
      # file name and leave the binary still claiming the old version.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $VERSION" Sources/asctl/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            Sources/asctl/Info.plist

      # Import the signing certificate, if one is configured.
      #
      # This is what makes privacy permissions survive an update. Without a
      # certificate the signature is ad-hoc, the designated requirement macOS
      # records is a hash of that one build, and TCC treats each release as a
      # different application. With one, the requirement names the certificate
      # instead and is identical for every build it signs.
      #
      # Absent secrets are not an error — forks and pull requests still build,
      # ad-hoc, exactly as before. See Scripts/make-signing-cert.sh.
      - name: Set up code signing
        env:
          CERT_BASE64: ${{ secrets.MACOS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo "no signing certificate configured — this build will be ad-hoc signed"
            echo "permissions will re-prompt after updating to it"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -A
          # Without this, codesign blocks on a keychain prompt that no one can
          # answer on a runner, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          # Not `find-identity -v`: a self-signed certificate is untrusted, so
          # the "valid identities" list is empty even though signing with it
          # works. The line also ends in (CSSMERR_TP_NOT_TRUSTED) rather than a
          # quote, so extract the quoted name rather than anchoring to the end.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" \
            | sed -n 's/^[[:space:]]*[0-9][0-9]*)[[:space:]]*[0-9A-Fa-f]*[[:space:]]*"\([^"]*\)".*/\1/p' \
            | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "the certificate imported but no code-signing identity came with it"
            exit 1
          fi
          echo "signing identity: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build both architectures
        run: |
          swift build -c release
          swift build -c release --triple x86_64-apple-macosx

      - name: Join them into one universal binary
        run: |
          mkdir -p dist
          lipo -create \
            .build/arm64-apple-macosx/release/asctl \
            .build/x86_64-apple-macosx/release/asctl \
            -output dist/asctl
          chmod +x dist/asctl
          lipo -archs dist/asctl

      - name: Check the binary is what it claims to be
        run: |
          # Both slices present, or the "universal" download is a lie.
          for arch in arm64 x86_64; do
            lipo -archs dist/asctl | grep -q "$arch" \
              || { echo "missing $arch slice"; exit 1; }
          done
          # The Info.plist is linked into __TEXT,__info_plist. A binary that
          # lost it aborts under CoreBluetooth with no message at all.
          otool -s __TEXT __info_plist dist/asctl | grep -q "__info_plist" \
            || { echo "Info.plist is not linked into the binary"; exit 1; }

      - name: Verify the payloads without hardware
        run: ./dist/asctl selftest

      - name: Build the app bundle and disk image
        env:
          ASCTL_BINARY: ${{ github.workspace }}/dist/asctl
        run: ./Scripts/make-dmg.sh dist

      - name: Sign the CLI binary
        run: |
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$SIGN_IDENTITY" --keychain "$SIGN_KEYCHAIN" dist/asctl
          else
            codesign --force --sign - dist/asctl
          fi

      # Record what the download will actually claim to be. The requirement is
      # the thing that determines whether permissions survive, so it belongs in
      # the log rather than being taken on trust.
      - name: Report the designated requirements
        run: |
          echo "app:"; codesign -dr - dist/asctl.app 2>&1 | grep designated
          echo "cli:"; codesign -dr - dist/asctl 2>&1 | grep designated

      - name: Package the CLI on its own
        run: |
          mkdir -p dist/cli
          cp dist/asctl dist/cli/
          cp Scripts/uninstall.sh dist/cli/
          cp README.md LICENSE dist/cli/
          tar -czf "dist/asctl-cli-universal.tar.gz" -C dist/cli .

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Pull this version's section out of CHANGELOG.md for the release body.
      #
      # generate_release_notes appends the commit list, which says what landed
      # but not what changed for someone installing it. The changelog says the
      # second thing, and keeping it in the repository means it is reviewed
      # with the change rather than written from memory at tag time.
      - name: Build the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          awk -v want="## $VERSION" '
            $0 == want { inside = 1; next }
            /^## / && inside { exit }
            inside { print }
          ' CHANGELOG.md > notes-body.md
          if [ ! -s notes-body.md ]; then
            echo "CHANGELOG.md has no section for $VERSION"
            echo "Add one before tagging, or the release ships without notes."
            exit 1
          fi
          { cat notes-body.md; echo; cat .github/release-footer.md; } > RELEASE_NOTES.md
          echo "--- release notes ---"; cat RELEASE_NOTES.md

      - name: Confirm the release assets exist and are not empty
        run: |
          # The previous workflow could "succeed" while attaching nothing,
          # because the publish step only ran on tags and nothing checked that
          # the files it referenced had been produced.
          for f in dist/*.dmg dist/asctl-cli-universal.tar.gz dist/SHA256SUMS.txt; do
            [ -s "$f" ] || { echo "missing or empty: $f"; exit 1; }
            echo "ok  $(du -h "$f" | cut -f1)  $f"
          done

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Published, not a draft. The in-app updater reads
          # /releases/latest, which skips drafts by design — a release left as
          # a draft is invisible to it, so "check for updates" would report
          # nothing however many releases existed.
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/asctl-cli-universal.tar.gz
            dist/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md

      - name: Upload artifacts when run by hand
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: asctl-release-preview
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/asctl-cli-universal.tar.gz
            dist/SHA256SUMS.txt
