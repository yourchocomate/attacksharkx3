name: Release

# Tag a version to publish:  git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to check the build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Each architecture is built natively rather than cross-compiled.
  #
  # `swift build --arch arm64 --arch x86_64` produces a universal binary in one
  # pass, but it drives xcbuild and so needs a full Xcode install — it fails
  # outright with only the command line tools. Building on two runners and
  # joining them with lipo works everywhere and is verifiable locally.
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Verify the payloads without hardware
        run: .build/release/asctl selftest

      - name: Confirm the architecture
        run: |
          file .build/release/asctl
          lipo -archs .build/release/asctl | grep -q '${{ matrix.arch }}'

      - uses: actions/upload-artifact@v4
        with:
          name: asctl-${{ matrix.arch }}
          path: .build/release/asctl
          retention-days: 1

  release:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Join the two builds into one universal binary
        run: |
          mkdir -p dist
          lipo -create \
            artifacts/asctl-arm64/asctl \
            artifacts/asctl-x86_64/asctl \
            -output dist/asctl
          chmod +x dist/asctl
          lipo -archs dist/asctl
          # The Info.plist is linked into __TEXT,__info_plist, so a binary that
          # lost it would abort under CoreBluetooth with no message at all.
          otool -s __TEXT __info_plist dist/asctl | grep -q "__info_plist"
          ./dist/asctl selftest

      - name: Build the app bundle and disk image
        env:
          ASCTL_BINARY: ${{ github.workspace }}/dist/asctl
        run: ./Scripts/make-dmg.sh dist

      - name: Package the CLI on its own
        run: |
          mkdir -p dist/cli
          cp dist/asctl dist/cli/
          cp Scripts/uninstall.sh dist/cli/
          cp README.md LICENSE dist/cli/
          tar -czf "dist/asctl-cli-universal.tar.gz" -C dist/cli .

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/asctl-cli-universal.tar.gz
            dist/SHA256SUMS.txt
          body: |
            ## Install

            **App** — download the `.dmg`, drag `asctl.app` to Applications.

            **CLI** — download the tarball, put `asctl` on your `PATH`.

            Both are universal (Apple silicon and Intel).

            ### First launch

            These builds are **ad-hoc signed, not notarised**, so macOS will
            refuse a double-click the first time. Right-click the app and choose
            Open, or for the CLI run `xattr -d com.apple.quarantine asctl`.

            Notarising needs a paid Developer ID, which this project does not
            have. The build is reproducible from source if you would rather not
            trust the binary — see the workflow.

            ### Permissions

            | Needed for | Grant |
            |---|---|
            | 2.4 GHz receiver or USB cable | Input Monitoring |
            | Bluetooth configuration and battery | Bluetooth |
            | Wheel-direction fix | Accessibility |

            macOS attributes each to the process that asks, so grant them to
            `asctl.app` rather than to your terminal.

            ### Uninstalling

            `uninstall.sh` ships in both downloads. It asks whether to keep
            `~/.config/asctl`, which holds your profiles — and since the mouse
            cannot be read back, that folder is the only record of a
            configuration that exists anywhere.

      - name: Upload artifacts when run by hand
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: asctl-release-preview
          path: |
            dist/*.dmg
            dist/asctl-cli-universal.tar.gz
            dist/SHA256SUMS.txt
